name: Deploy to Vercel

on:
  # Production: automatic, after CI Security Gate and E2E Tests pass on a push to main.
  workflow_run:
    workflows: ['CI Security Gate', 'E2E Tests']
    types: [completed]
  # Preview: manual only. Automatic per-PR previews exhausted Vercel's Hobby-tier
  # daily deployment limit on busy Dependabot days (2026-10-10).
  #   gh workflow run deploy-vercel.yml -f pr=<number>
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to deploy as a preview'
        required: true
        type: number

permissions:
  contents: read
  deployments: write
  actions: read
  pull-requests: write # comment the preview URL on the PR

jobs:
  gate:
    name: Check all required workflows passed
    # PR workflow_runs no longer deploy anything, so don't spend a runner on them.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      event: ${{ steps.check.outputs.event }}
      branch: ${{ steps.check.outputs.branch }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Verify CI Security Gate and E2E Tests both succeeded
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Run the workflow definition from main only, so a PR can't alter the
            # workflow that holds the Vercel token.
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "::error::Run preview deploys from main: gh workflow run deploy-vercel.yml -f pr=<number>"
              exit 1
            fi
            PR="${{ inputs.pr }}"
            pr_json=$(gh pr view "$PR" --repo "$REPO" --json headRefOid,headRefName,state,isCrossRepository)
            if [[ "$(jq -r .isCrossRepository <<<"$pr_json")" == "true" ]]; then
              echo "::error::PR #$PR is from a fork; preview deploys only build same-repo branches."
              exit 1
            fi
            if [[ "$(jq -r .state <<<"$pr_json")" != "OPEN" ]]; then
              echo "::error::PR #$PR is not open."
              exit 1
            fi
            SHA=$(jq -r .headRefOid <<<"$pr_json")
            BRANCH=$(jq -r .headRefName <<<"$pr_json")
            EVENT="manual_preview"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            EVENT="${{ github.event.workflow_run.event }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi

          get_conclusion() {
            gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq ".workflow_runs[] | select(.name == \"$1\") | .conclusion" \
              | head -1
          }

          ci=$(get_conclusion "CI Security Gate")
          e2e=$(get_conclusion "E2E Tests")

          echo "CI Security Gate: $ci"
          echo "E2E Tests: $e2e"

          # E2E may be absent if path filters excluded it — treat absence as pass
          e2e_ok=false
          [[ "$e2e" == "success" || -z "$e2e" ]] && e2e_ok=true

          if [[ "$ci" == "success" && "$e2e_ok" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "One or more required workflows have not succeeded — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

          echo "event=$EVENT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy to Production
    needs: [gate]
    # Only deploy from main push when gate confirms both workflows passed
    if: |
      needs.gate.outputs.ready == 'true' &&
      needs.gate.outputs.branch == 'main' &&
      needs.gate.outputs.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-preview:
    name: Deploy Preview
    needs: [gate]
    # Manual only (workflow_dispatch), once the gate confirms both workflows passed for the PR head
    if: |
      needs.gate.outputs.ready == 'true' &&
      needs.gate.outputs.event == 'manual_preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Report preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          echo "Preview for PR #${{ inputs.pr }} (${SHA:0:7}): $URL" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ inputs.pr }}" --repo "${{ github.repository }}" \
            --body "Preview deployment for ${SHA:0:7}: $URL"
